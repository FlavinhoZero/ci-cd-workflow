name: Probe Reusable

on:
  workflow_call:
    inputs:
      probe_text:
        description: 'Probe text'
        required: false
        default: 'hello'
    secrets:
      NONE:

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    steps:
      - name: Echo
        run: echo "probe ok: ${{ inputs.probe_text }}"