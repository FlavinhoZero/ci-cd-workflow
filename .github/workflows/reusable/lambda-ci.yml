name: Lambda CI/CD Pipeline

on:
  workflow_call:
    inputs:
      aws_account_id:
        description: 'AWS Account ID'
        required: true
      aws_region:
        description: 'AWS Region'
        required: true
        default: 'sa-east-1'
      lambda_function_name:
        description: 'Lambda Function Name'
        required: false
      dynamodb_table_name:
        description: 'DynamoDB Table Name'
        required: false
      sns_topic_name:
        description: 'SNS Topic Name'
        required: false
      package_lambda:
        description: 'Package Lambda function (true/false)'
        required: true
        default: 'true'
      cognito_user_pool_id:
        description: 'Cognito User Pool ID'
        required: false
      cognito_app_client_id:
        description: 'Cognito App Client ID'
        required: false
      binance_testnet:
        description: 'Use Binance Testnet (true/false)'
        required: false
        default: 'false'
      binance_demo_mode:
        description: 'Binance Demo Mode (true/false)'
        required: false
        default: 'false'
      use_binance_proxy:
        description: 'Use Binance Proxy (true/false)'
        required: false
        default: 'false'
      binance_proxy_url:
        description: 'Binance Proxy URL'
        required: false
        default: ''
      proxy_fallback_enabled:
        description: 'Proxy Fallback Enabled (true/false)'
        required: false
        default: 'false'
    secrets:
      - id: AWS_ACCOUNT_ID
        description: 'AWS Account ID'
        required: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

      - name: Run tests
        run: |
          if [ -f requirements-test.txt ]; then
            PYTHONPATH=${{ github.workspace }} pytest tests/ --cov=src -v
          else
            echo "No tests to run"
          fi

  package:
    name: Package Lambda
    needs: test
    if: inputs.package_lambda == 'true'
    runs-on: ubuntu-latest
    outputs:
      package_created: ${{ steps.package.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Lambda
        id: package
        run: |
          cd ${{ github.workspace }}
          pip install -r requirements.txt -t lambda_package/
          cp -r src/* lambda_package/
          cd lambda_package
          zip -r ../lambda_package.zip .
          cd ..
          echo "created=true" >> $GITHUB_OUTPUT
          echo "Lambda package created successfully"

  plan:
    name: Terraform Plan
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/github-actions-deploy
          aws-region: ${{ inputs.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Set Terraform Variables
        run: |
          echo "TF_VAR_lambda_function_name=${{ inputs.lambda_function_name }}" >> $GITHUB_ENV
          echo "TF_VAR_environment=prod" >> $GITHUB_ENV
          if [ -n "${{ inputs.cognito_user_pool_id }}" ]; then
            echo "TF_VAR_cognito_user_pool_id=${{ inputs.cognito_user_pool_id }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ inputs.cognito_app_client_id }}" ]; then
            echo "TF_VAR_cognito_app_client_id=${{ inputs.cognito_app_client_id }}" >> $GITHUB_ENV
          fi
          echo "TF_VAR_binance_testnet=${{ inputs.binance_testnet }}" >> $GITHUB_ENV
          echo "TF_VAR_binance_demo_mode=${{ inputs.binance_demo_mode }}" >> $GITHUB_ENV
          echo "TF_VAR_use_binance_proxy=${{ inputs.use_binance_proxy }}" >> $GITHUB_ENV
          echo "TF_VAR_binance_proxy_url=${{ inputs.binance_proxy_url }}" >> $GITHUB_ENV
          echo "TF_VAR_proxy_fallback_enabled=${{ inputs.proxy_fallback_enabled }}" >> $GITHUB_ENV

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=terraform-state-${{ inputs.aws_account_id }}" \
            -backend-config="key=${{ github.repository_owner }}/${{ github.event.repository.name }}/terraform.tfstate" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=terraform-lock"

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Refresh
        working-directory: terraform
        run: terraform refresh -compact-warnings

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v3
        with:
          name: tfplan
          path: terraform/tfplan

  deploy-test:
    name: Deploy to Test
    needs: plan
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: test
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Terraform Plan
        uses: actions/download-artifact@v3
        with:
          name: tfplan
          path: terraform/

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/github-actions-deploy
          aws-region: ${{ inputs.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

  deploy-production:
    name: Deploy to Production
    needs: plan
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Terraform Plan
        uses: actions/download-artifact@v3
        with:
          name: tfplan
          path: terraform/

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/github-actions-deploy
          aws-region: ${{ inputs.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

  create-release:
    name: Create Release
    needs: deploy-production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/github-actions-deploy
          aws-region: ${{ inputs.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Get Version from Terraform
        id: version
        working-directory: terraform
        run: |
          VERSION=$(terraform output -raw version 2>/dev/null || echo "v1.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}