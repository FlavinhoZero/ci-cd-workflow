name: Lambda CI/CD Pipeline

on:
  workflow_call:
    inputs:
      aws_account_id:
        description: 'AWS Account ID'
        type: string
        required: true
      aws_region:
        description: 'AWS Region'
        type: string
        required: true
        default: 'sa-east-1'
      confirm_production_deploy:
        description: 'Explicit confirmation to deploy to production (true/false). Deploy to production ONLY runs via workflow_dispatch with this set to true.'
        type: boolean
        required: false
        default: false
      # Note: NO resource-name/variable inputs — per-governance rule 2026-08-18
      # all resource names / TF_VAR_* live in the consuming repo's terraform/
      # (variables.tf defaults / locals.tf / tfvars). This workflow only gets
      # orchestration inputs (account id, region) and the build is done HERE
      # (the workflow owns the Lambda packaging, not the lambda repository).

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # runtime deps (required by src/, e.g. python-binance) + test deps
          if [ -f requirements.txt ]; then pip install --only-binary :all: -r requirements.txt; fi
          if [ -f requirements-test.txt ]; then pip install --only-binary :all: -r requirements-test.txt; fi
      - name: Run tests
        run: |
          if [ -f requirements-test.txt ]; then
            python -m pytest tests/ --cov=src -v
          else
            echo "No tests to run"
          fi

      - name: Security scan - pip-audit
        if: always() && hashFiles('requirements*.txt') != ''
        run: |
          pip install --only-binary :all: 'pip-audit==2.10.1'
          pip-audit -r requirements.txt -r requirements-test.txt --desc --format=json --output=pip-audit-report.json || true
          cat pip-audit-report.json | jq '.vulnerabilities[] | "\(.package) \(.version) \(.id) \(.description)"' -r || true

      # Trivy installed via official APT repo (NOT trivy-action/setup-trivy:
      # their GitHub Releases download proved unreliable from Actions runners).
      # Scan is informational (exit-code 0); findings appear in the job log.
      - name: Install Trivy (APT repo)
        if: always()
        run: |
          set -euo pipefail
          sudo install -m 0755 -d /etc/apt/keyrings
          curl --proto '=https' --tlsv1.2 -fsSL https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /etc/apt/keyrings/trivy.gpg
          echo "deb [signed-by=/etc/apt/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list > /dev/null
          sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/trivy.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y trivy
          trivy --version

      - name: Security scan - Trivy (informational, log output)
        if: always()
        run: |
          trivy fs --scanners vuln --vuln-type os,library \
            --severity CRITICAL,HIGH --ignore-unfixed \
            --format table --exit-code 0 .

  package:
    name: Package Lambda
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5
        with:
          python-version: '3.11'
      - name: Build Lambda package
        run: |
          set -euo pipefail
          mkdir -p lambda_package
          # Install runtime deps into the package dir
          if [ -f requirements.txt ]; then
            python -m pip install --only-binary :all: --quiet --target lambda_package -r requirements.txt
          fi
          # Copy application source
          if [ -d src ]; then
            cp -R src/. lambda_package/
          fi
          # Remove pycache/pyc
          find lambda_package -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find lambda_package -name '*.pyc' -delete 2>/dev/null || true
      - name: Zip Lambda package
        run: |
          cd lambda_package
          zip -qr ../lambda_package.zip .
          cd ..
          ls -lh lambda_package.zip
      - name: Setup Terraform (pre-fetch provider)
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v3
        with:
          terraform_version: "1.6.0"
      - name: Pre-fetch Terraform providers (filesystem mirror)
        run: |
          set -euo pipefail
          # Download the AWS provider zip directly from releases.hashicorp.com
          # (no GPG signature check) and expose it as a filesystem mirror so
          # terraform init never hits "error checking signature".
          MIRROR_DIR="$HOME/.terraform.d/mirror"
          mkdir -p "$MIRROR_DIR/registry.terraform.io/hashicorp/aws"
          curl -fsSL -o "$MIRROR_DIR/registry.terraform.io/hashicorp/aws/terraform-provider-aws_5.100.0_linux_amd64.zip" \
            "https://releases.hashicorp.com/terraform-provider-aws/5.100.0/terraform-provider-aws_5.100.0_linux_amd64.zip"
          ls -lh "$MIRROR_DIR/registry.terraform.io/hashicorp/aws/"
          # Write CLI config pointing at the mirror
          cat > "$HOME/.terraformrc" <<'EOF'
          provider_installation {
            filesystem_mirror {
              path    = "/home/runner/.terraform.d/mirror"
              include = ["registry.terraform.io/hashicorp/aws"]
            }
            direct {
              exclude = ["registry.terraform.io/hashicorp/aws"]
            }
          }
          EOF
          echo "TF_CLI_CONFIG_FILE=$HOME/.terraformrc" >> "$GITHUB_ENV"
      - name: Upload Lambda package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: lambda-package
          path: lambda_package.zip
          if-no-files-found: error

  plan:
    name: Terraform Plan
    needs: [test, package]
    runs-on: ubuntu-latest
    environment: test
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - name: Download Lambda package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4
        with:
          name: lambda-package
          path: ${{ github.workspace }}
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/${{ secrets.AWS_DEPLOY_ROLE_NAME }}
          aws-region: ${{ inputs.aws_region }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v3
        with:
          terraform_version: "1.6.0"
      - name: Configure provider filesystem mirror
        run: |
          set -euo pipefail
          MIRROR_DIR="$HOME/.terraform.d/mirror"
          mkdir -p "$MIRROR_DIR/registry.terraform.io/hashicorp/aws"
          curl -fsSL -o "$MIRROR_DIR/registry.terraform.io/hashicorp/aws/terraform-provider-aws_5.100.0_linux_amd64.zip" \
            "https://releases.hashicorp.com/terraform-provider-aws/5.100.0/terraform-provider-aws_5.100.0_linux_amd64.zip"
          cat > "$HOME/.terraformrc" <<'EOF'
          provider_installation {
            filesystem_mirror {
              path    = "/home/runner/.terraform.d/mirror"
              include = ["registry.terraform.io/hashicorp/aws"]
            }
            direct {
              exclude = ["registry.terraform.io/hashicorp/aws"]
            }
          }
          EOF
          echo "TF_CLI_CONFIG_FILE=$HOME/.terraformrc" >> "$GITHUB_ENV"
      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ github.repository }}/terraform.tfstate" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"
      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate
      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan -input=false
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: tfplan
          path: terraform/tfplan
          if-no-files-found: error

  deploy-test:
    name: Deploy to Test
    needs: plan
    # Deploy to test only on develop pushes/PRs. Skip when this run is a
    # confirmed production deploy (manual dispatch) so we don't re-apply to
    # test at the same time as production.
    if: github.ref == 'refs/heads/develop' && !(github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == true)
    runs-on: ubuntu-latest
    environment: test
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - name: Download Lambda package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4
        with:
          name: lambda-package
          path: ${{ github.workspace }}
      - name: Download Terraform Plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4
        with:
          name: tfplan
          path: terraform/tfplan-download
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/${{ secrets.AWS_DEPLOY_ROLE_NAME }}
          aws-region: ${{ inputs.aws_region }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v3
        with:
          terraform_version: "1.6.0"
      - name: Configure provider filesystem mirror
        run: |
          set -euo pipefail
          MIRROR_DIR="$HOME/.terraform.d/mirror"
          mkdir -p "$MIRROR_DIR/registry.terraform.io/hashicorp/aws"
          curl -fsSL -o "$MIRROR_DIR/registry.terraform.io/hashicorp/aws/terraform-provider-aws_5.100.0_linux_amd64.zip" \
            "https://releases.hashicorp.com/terraform-provider-aws/5.100.0/terraform-provider-aws_5.100.0_linux_amd64.zip"
          cat > "$HOME/.terraformrc" <<'EOF'
          provider_installation {
            filesystem_mirror {
              path    = "/home/runner/.terraform.d/mirror"
              include = ["registry.terraform.io/hashicorp/aws"]
            }
            direct {
              exclude = ["registry.terraform.io/hashicorp/aws"]
            }
          }
          EOF
          echo "TF_CLI_CONFIG_FILE=$HOME/.terraformrc" >> "$GITHUB_ENV"
      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ github.repository }}/terraform.tfstate" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"
      - name: Terraform Apply
        working-directory: terraform
        run: |
          ls -la tfplan-download/
          cp tfplan-download/tfplan ./tfplan
          terraform apply -auto-approve ./tfplan

  deploy-production:
    name: Deploy to Production
    needs: plan
    # Security: deploy to production ONLY via manual workflow_dispatch with
    # explicit confirmation. Never automatic on push/merge to main.
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == true
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - name: Download Lambda package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4
        with:
          name: lambda-package
          path: ${{ github.workspace }}
      - name: Download Terraform Plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v4
        with:
          name: tfplan
          path: terraform/tfplan-download
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/${{ secrets.AWS_DEPLOY_ROLE_NAME }}
          aws-region: ${{ inputs.aws_region }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v3
        with:
          terraform_version: "1.6.0"
      - name: Configure provider filesystem mirror
        run: |
          set -euo pipefail
          MIRROR_DIR="$HOME/.terraform.d/mirror"
          mkdir -p "$MIRROR_DIR/registry.terraform.io/hashicorp/aws"
          curl -fsSL -o "$MIRROR_DIR/registry.terraform.io/hashicorp/aws/terraform-provider-aws_5.100.0_linux_amd64.zip" \
            "https://releases.hashicorp.com/terraform-provider-aws/5.100.0/terraform-provider-aws_5.100.0_linux_amd64.zip"
          cat > "$HOME/.terraformrc" <<'EOF'
          provider_installation {
            filesystem_mirror {
              path    = "/home/runner/.terraform.d/mirror"
              include = ["registry.terraform.io/hashicorp/aws"]
            }
            direct {
              exclude = ["registry.terraform.io/hashicorp/aws"]
            }
          }
          EOF
          echo "TF_CLI_CONFIG_FILE=$HOME/.terraformrc" >> "$GITHUB_ENV"
      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ github.repository }}/terraform.tfstate" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"
      - name: Terraform Apply
        working-directory: terraform
        run: |
          ls -la tfplan-download/
          cp tfplan-download/tfplan ./tfplan
          terraform apply -auto-approve ./tfplan
      # After a successful production deploy, sync the source branch into main
      # so main always reflects what is actually running in production.
      - name: Merge source branch into main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git merge --no-edit "origin/${{ github.ref_name }}"
          git push origin main
