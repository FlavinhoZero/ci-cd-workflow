name: Lambda CI/CD Pipeline

on:
  workflow_call:
    inputs:
      aws_account_id:
        description: 'AWS Account ID'
        type: string
        required: true
      aws_region:
        description: 'AWS Region'
        type: string
        required: true
        default: 'sa-east-1'
      # Note: NO resource-name/variable inputs and no package flag.
      # The Lambda package is assembled at Terraform runtime via the repo's
      # terraform/build-lambda.sh (local-exec) — governance rule (Plan 010).
      # All per-repo names (lambda name, tables, SNS, env vars) live in the
      # repo's own terraform/ (locals.tf / variables.tf / tfvars) — never here.
      # NOTE: no secrets declared — aws_account_id is passed as input only,
      # which avoids caller-side secret/vars mapping issues.

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

      - name: Run tests
        run: |
          if [ -f requirements-test.txt ]; then
            PYTHONPATH=${{ github.workspace }} pytest tests/ --cov=src -v
          else
            echo "No tests to run"
          fi

  plan:
    name: Terraform Plan
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: no Lambda package job exists here anymore.
      # The deployment package is assembled at Terraform runtime via the
      # repo's terraform/build-lambda.sh (local-exec in main.tf).
      # Governance rule (Plan 010, 2026-08-18).

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/github-actions-deploy
          aws-region: ${{ inputs.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Set Terraform Variables
        run: |
          echo "TF_VAR_environment=prod" >> $GITHUB_ENV
          # No per-repo TF_VAR_* here — resource names come from the repo's
          # own terraform/variables.tf defaults + locals.tf (governance rule 2026-08-18)

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=terraform-state-${{ inputs.aws_account_id }}" \
            -backend-config="key=${{ github.repository }}/terraform.tfstate" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=terraform-lock"

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        # import {} blocks in repo HCL are applied automatically during plan
        run: terraform plan -out=tfplan -input=false

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          if-no-files-found: error

  deploy-test:
    name: Deploy to Test
    needs: plan
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Terraform Plan
        uses: actions/download-artifact@v3
        with:
          name: tfplan
          path: terraform/

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/github-actions-deploy
          aws-region: ${{ inputs.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

  deploy-production:
    name: Deploy to Production
    needs: plan
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Terraform Plan
        uses: actions/download-artifact@v3
        with:
          name: tfplan
          path: terraform/

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/github-actions-deploy
          aws-region: ${{ inputs.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

  create-release:
    name: Create Release
    needs: deploy-production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/github-actions-deploy
          aws-region: ${{ inputs.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Init (for output)
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=terraform-state-${{ inputs.aws_account_id }}" \
            -backend-config="key=${{ github.repository }}/terraform.tfstate" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=terraform-lock"

      - name: Get Version from Terraform
        id: version
        working-directory: terraform
        run: |
          VERSION=$(terraform output -raw version 2>/dev/null || echo "v1.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}