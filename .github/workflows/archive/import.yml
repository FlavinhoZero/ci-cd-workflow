name: Import Existing Resources

on:
  workflow_call:
    inputs:
      aws_account_id:
        description: 'AWS Account ID'
        required: true
        type: string
      aws_region:
        description: 'AWS Region'
        required: true
        type: string
        default: 'sa-east-1'
      resource_type:
        description: 'Type of resource to import (lambda, dynamodb, sns, sqs)'
        required: true
        type: string
      resource_name:
        description: 'Name of the resource to import'
        required: true
        type: string
      terraform_resource_address:
        description: 'Terraform resource address (e.g., aws_lambda_function.my_lambda)'
        required: true
        type: string

jobs:
  import:
    name: Import ${{ inputs.resource_type }} - ${{ inputs.resource_name }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/${{ secrets.AWS_DEPLOY_ROLE_NAME }}
          aws-region: ${{ inputs.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ github.repository_owner }}/${{ github.event.repository.name }}/terraform.tfstate" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Import Resource
        working-directory: terraform
        run: |
          case ${{ inputs.resource_type }} in
            lambda)
              aws_lambda_arn=$(aws lambda get-function --function-name ${{ inputs.resource_name }} --query 'Configuration.FunctionArn' --output text)
              terraform import ${{ inputs.terraform_resource_address }} "$aws_lambda_arn"
              ;;
            dynamodb)
              aws dynamodb describe-table --table-name ${{ inputs.resource_name }} > /dev/null
              terraform import ${{ inputs.terraform_resource_address }} ${{ inputs.resource_name }}
              ;;
            sns)
              aws sns get-topic-attributes --topic-arn arn:aws:sns:${{ inputs.aws_region }}:${{ inputs.aws_account_id }}:${{ inputs.resource_name }} > /dev/null
              terraform import ${{ inputs.terraform_resource_address }} "arn:aws:sns:${{ inputs.aws_region }}:${{ inputs.aws_account_id }}:${{ inputs.resource_name }}"
              ;;
            sqs)
              aws sqs get-queue-attributes --queue-url https://sqs.${{ inputs.aws_region }}.amazonaws.com/${{ inputs.aws_account_id }}/${{ inputs.resource_name }} > /dev/null
              terraform import ${{ inputs.terraform_resource_address }} https://sqs.${{ inputs.aws_region }}.amazonaws.com/${{ inputs.aws_account_id }}/${{ inputs.resource_name }}
              ;;
            *)
              echo "Unsupported resource type: ${{ inputs.resource_type }}"
              exit 1
              ;;
          esac

      - name: Terraform Plan (after import)
        working-directory: terraform
        run: terraform plan
