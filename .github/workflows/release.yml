name: Release Workflow

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type (major, minor, patch)'
        type: choice
        required: true
        default: 'patch'
        options:
          - major
          - minor
          - patch
      dry_run:
        description: 'Dry run (no tag push)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4  # v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Get current version
        id: current_version
        run: |
          # Get latest tag matching vX.Y.Z
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Current version: $LATEST_TAG"

      - name: Calculate new version
        id: new_version
        run: |
          LATEST_TAG="${{ steps.current_version.outputs.latest_tag }}"
          # Remove 'v' prefix
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          case "${{ github.event.inputs.version_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_TAG"

      - name: Generate changelog
        id: changelog
        run: |
          LATEST_TAG="${{ steps.current_version.outputs.latest_tag }}"
          NEW_TAG="${{ steps.new_version.outputs.new_tag }}"
          
          # Get commits since last tag
          if [ "$LATEST_TAG" != "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" "$LATEST_TAG"..HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)")
          fi
          
          # Categorize commits
          FEATURES=$(echo "$COMMITS" | grep -E '^(feat|feature):' | sed 's/^/- /' || true)
          FIXES=$(echo "$COMMITS" | grep -E '^(fix|security):' | sed 's/^/- /' || true)
          OTHERS=$(echo "$COMMITS" | grep -vE '^(feat|feature|fix|security):' | sed 's/^/- /' || true)
          
          CHANGELOG="## $NEW_TAG ($(date +%Y-%m-%d))"
          
          if [ -n "$FEATURES" ]; then
            CHANGELOG="$CHANGELOG\n\n### Features\n$FEATURES"
          fi
          if [ -n "$FIXES" ]; then
            CHANGELOG="$CHANGELOG\n\n### Fixes / Security\n$FIXES"
          fi
          if [ -n "$OTHERS" ]; then
            CHANGELOG="$CHANGELOG\n\n### Other\n$OTHERS"
          fi
          
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Show release info
        run: |
          echo "=== Release Summary ==="
          echo "Current: ${{ steps.current_version.outputs.latest_tag }}"
          echo "New:     ${{ steps.new_version.outputs.new_tag }}"
          echo "Type:    ${{ github.event.inputs.version_type }}"
          echo "Dry run: ${{ github.event.inputs.dry_run }}"
          echo ""
          echo "Changelog:"
          echo "${{ steps.changelog.outputs.changelog }}"

      - name: Create and push tag
        if: github.event.inputs.dry_run != 'true'
        run: |
          NEW_TAG="${{ steps.new_version.outputs.new_tag }}"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"
          echo "Tag $NEW_TAG pushed successfully"

      - name: Create GitHub Release
        if: github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231  # v1  # v1
        with:
          tag_name: ${{ steps.new_version.outputs.new_tag }}
          name: Release ${{ steps.new_version.outputs.new_tag }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false

      - name: Update CHANGELOG.md
        if: github.event.inputs.dry_run != 'true'
        run: |
          NEW_TAG="${{ steps.new_version.outputs.new_tag }}"
          CHANGELOG="${{ steps.changelog.outputs.changelog }}"
          
          # Prepend to CHANGELOG.md
          TEMP_FILE=$(mktemp)
          echo -e "$CHANGELOG\n" > "$TEMP_FILE"
          cat CHANGELOG.md >> "$TEMP_FILE"
          mv "$TEMP_FILE" CHANGELOG.md
          
          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG.md for $NEW_TAG"
          git push origin HEAD:main
